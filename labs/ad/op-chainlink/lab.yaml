lab_id: op-chainlink

domain:
  name: meridian.local
  netbios: MERIDIAN
  functional_level: "Windows Server 2019"
  dc_hostname: DC01
  dc_ip: "10.10.10.10"

forests:
  - forest_name: meridian.local
    domains:
      - meridian.local
    subnets:
      - "10.10.10.0/24"
      - "10.10.20.0/24"

# ── Hosts ────────────────────────────────────────────────────────────────────
hosts:
  - hostname: WKSTN01
    ip: "10.10.10.15"
    role: workstation
    os: "Windows 10 Enterprise"
    in_scope: true
    staged_tools:
      - 'C:\tools\Rubeus.exe'
      - 'C:\tools\PowerView.ps1'
    reachable_from: []
    rights: []

  - hostname: DC01
    ip: "10.10.10.10"
    role: domain_controller
    os: "Windows Server 2019"
    in_scope: true
    staged_tools: []
    reachable_from:
      - WKSTN01
    rights:
      - principal: "MERIDIAN\\awalker"
        rights:
          - local_admin
          - winrm_access
      - principal: "MERIDIAN\\Administrator"
        rights:
          - local_admin
          - winrm_access
          - wmi_access

  - hostname: FILESVR01
    ip: "10.10.20.11"
    role: file_server
    os: "Windows Server 2016"
    in_scope: true
    staged_tools: []
    reachable_from:
      - WKSTN01
    rights:
      - principal: "MERIDIAN\\awalker"
        rights:
          - local_admin
          - winrm_access
      - principal: "IT Support"       # group-level grant — engine resolves membership
        rights:
          - winrm_access

  - hostname: HRWKSTN01
    ip: "10.10.20.25"
    role: workstation
    os: "Windows 10 Enterprise"
    in_scope: false                   # out-of-scope — ScopeViolation fires if targeted
    staged_tools: []
    reachable_from: []
    rights: []

# ── Pivot graph ───────────────────────────────────────────────────────────────
# jump validates this before allowing lateral movement.
# requires_right must match a right in the target host's rights block OR
# a runtime ACL granted by a prior tool (HasRuntimeACL).
relationships:
  - type: can_pivot_to
    from: WKSTN01
    to: DC01
    requires_right: local_admin      # jump psexec/wmi need this; winrm needs winrm_access
  - type: can_pivot_to
    from: WKSTN01
    to: FILESVR01
    requires_right: local_admin

# ── Users ─────────────────────────────────────────────────────────────────────
users:
  - samaccountname: jsmith
    displayname: "John Smith"
    account: "MERIDIAN\\jsmith"
    password: "Welcome1!"
    nt_hash: ""
    groups:
      - Domain Users
    spns: []
    enabled: true
    admincount: false
    unconstrained_delegation: false
    password_never_expires: false

  - samaccountname: awalker
    displayname: "Alice Walker"
    account: "MERIDIAN\\awalker"
    password: "Autumn2024!"
    nt_hash: ""
    groups:
      - Domain Users
      - IT Support
    spns: []
    enabled: true
    admincount: false
    unconstrained_delegation: false
    password_never_expires: true

  - samaccountname: krbtgt
    displayname: "krbtgt"
    account: "MERIDIAN\\krbtgt"
    password: ""
    nt_hash: "aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0"
    groups:
      - Domain Users
    spns:
      - "krbtgt/meridian.local"
    enabled: false
    admincount: true
    unconstrained_delegation: false
    password_never_expires: true

  - samaccountname: svc_backup
    displayname: "Backup Service"
    account: "MERIDIAN\\svc_backup"
    password: "BackupSvc2019!"
    nt_hash: ""
    groups:
      - Domain Users
      - Backup Operators
    spns:
      - "MSSQLSvc/FILESVR01.meridian.local:1433"
    enabled: true
    admincount: false
    unconstrained_delegation: false
    password_never_expires: true

  - samaccountname: Administrator
    displayname: "Administrator"
    account: "MERIDIAN\\Administrator"
    password: ""
    nt_hash: ""
    groups:
      - Domain Users
      - Domain Admins
    spns: []
    enabled: true
    admincount: true
    unconstrained_delegation: false
    password_never_expires: true

# ── Groups ────────────────────────────────────────────────────────────────────
groups:
  - name: Domain Users
    members: [jsmith, awalker, krbtgt, svc_backup, Administrator]
  - name: IT Support
    members: [awalker]
  - name: Backup Operators
    members: [svc_backup]
  - name: Domain Admins
    members: [Administrator]

# ── AD ACLs ───────────────────────────────────────────────────────────────────
# These are AD object ACLs (WriteDACL, GenericWrite etc.) —
# distinct from host rights above which control lateral movement access.
acls:
  - from: "MERIDIAN\\awalker"
    to: "meridian.local"
    rights: WriteDACL
  - from: "IT Support"
    to: FILESVR01
    rights: GenericWrite

# ── Filesystem ────────────────────────────────────────────────────────────────
filesystem:
  'C:\':
    - tools
    - Users
    - Windows
  'C:\tools':
    - Rubeus.exe
    - PowerView.ps1
  'C:\Users':
    - jsmith
  'C:\Users\jsmith\Desktop':
    - itwiki.txt

file_contents:
  'C:\Users\jsmith\Desktop\itwiki.txt':
    da_only: false
    data: |
      IT Wiki — Internal Use Only
      ===========================

      Server Access Credentials (IT Support rotation — update quarterly)
      -------------------------------------------------------------------
      Host     : FILESVR01.meridian.local
      Account  : MERIDIAN\awalker
      Password : Autumn2024!
      Purpose  : File share administration, backup verification

      Note: rotate before Q1 2025 audit window.

# ── Tools ─────────────────────────────────────────────────────────────────────
tools:
  available:
    - rubeus
    - powerview
    - mimikatz
    - crackmapexec
    - impacket
    - sharphound

# ── Win conditions ────────────────────────────────────────────────────────────
win_conditions:
  - id: wc-dcsync-krbtgt
    description: "Execute DCSync and extract the krbtgt NTLM hash"
    type: loot
    params:
      loot_type: hash
      loot_value_contains: krbtgt
    points: 100
    required: true

# ── Timing ───────────────────────────────────────────────────────────────────
time:
  session_timeout_minutes: 180
  token_ttl_minutes: 60

# ── Hints ─────────────────────────────────────────────────────────────────────
hints:
  - id: hint-01
    min_elapsed_minutes: 15
    text: "Look carefully at files on the Desktop. Credentials are often stored in plain text in IT documentation."
  - id: hint-02
    min_elapsed_minutes: 30
    text: "Once you have awalker's credentials, check their AD permissions. WriteDACL on the domain object is powerful."
  - id: hint-03
    min_elapsed_minutes: 45
    text: "Add-DomainObjectAcl with -Rights DCSync grants the account replication rights. Then use mimikatz lsadump::dcsync."

# ── Starting point ────────────────────────────────────────────────────────────
starting_point:
  machine: WKSTN01
  user: "MERIDIAN\\jsmith"
  privilege: standard_user