version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantzero
      POSTGRES_PASSWORD: tenantzero
      POSTGRES_DB: tenantzero
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: "postgres://tenantzero:tenantzero@db:5432/tenantzero?sslmode=disable"
      JWT_SECRET: "change-me-in-production"
      SERVER_PORT: "8080"
      LABS_DIR: "/labs"
    volumes:
      - ./labs:/labs:ro
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata: